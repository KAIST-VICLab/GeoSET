name: test_HI_Diff_sar2eo
model_type: HI_Diff_S2
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  test_1:
    name: sar2eo
    type: PairedImageIRDataset
    dataroot_gt: ${WORK_DIR}/diff_data/sar2eo/paired/testB
    dataroot_lq: ${WORK_DIR}/diff_data/sar2eo/paired/testA
    meta_info_file: ${TEST_ORDER}
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: Transformer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [3,5,6,6]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  dual_pixel_task: False
  embed_dim: 64
  group: 4

network_le:
  type: latent_encoder_gelu
  in_chans: 6
  embed_dim: 64
  block_num: 6
  group: 4
  stage: 1
  patch_expansion: 0.5
  channel_expansion: 4

network_le_dm:
  type: latent_encoder_gelu
  in_chans: 3
  embed_dim: 64
  block_num: 6
  group: 4
  stage: 2
  patch_expansion: 0.5
  channel_expansion: 4

network_d:
  type: denoising
  in_channel: 256
  out_channel: 256
  inner_channel: 512
  block_num: 4
  group: 4
  patch_expansion: 0.5
  channel_expansion: 2

diffusion_schedule:
  apply_ldm: False
  schedule: linear
  timesteps: 8
  linear_start: 0.1
  linear_end: 0.99

path:
  pretrain_network_g: ${CKPT_ROOT}/hi-diff/sar2eo/S2_net_g_latest.pth
  param_key_g: params
  strict_load_g: true

  pretrain_network_le_dm: ${CKPT_ROOT}/hi-diff/sar2eo/S2_net_le_dm_latest.pth
  param_key_g: params
  strict_load_le_dm: true

  pretrain_network_d: ${CKPT_ROOT}/hi-diff/sar2eo/S2_net_d_latest.pth
  param_key_g: params
  strict_load_d: true

  resume_state: ~

val:
  save_img: True
  suffix: ''
  selfensemble_testing: False

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
