name: train_HI_Diff_sar2eo_S1
model_type: HI_Diff_S1
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  train:
    name: TrainSet
    type: PairedImageIRDataset
    dataroot_gt: ${WORK_DIR}/diff_data/sar2eo/paired/trainB
    dataroot_lq: ${WORK_DIR}/diff_data/sar2eo/paired/trainA
    meta_info_file: ${WORK_DIR}/diff_data/sar2eo/paired/meta_train.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk

    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

    mini_batch_sizes: [8]
    iters: [25000]
    gt_size: 256
    gt_sizes: [256]

  val:
    name: ValSet
    type: PairedImageIRDataset
    dataroot_gt: ${WORK_DIR}/diff_data/sar2eo/paired/valB
    dataroot_lq: ${WORK_DIR}/diff_data/sar2eo/paired/valA
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: Transformer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [3,5,6,6]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  dual_pixel_task: False
  embed_dim: 64
  group: 4

network_le:
  type: latent_encoder_gelu
  in_chans: 6
  embed_dim: 64
  block_num: 6
  group: 4
  stage: 1
  patch_expansion: 0.5
  channel_expansion: 4

path:
  pretrain_network_g: ~
  param_key_g: params
  strict_load_g: true

  pretrain_network_le: ~
  param_key_g: params
  strict_load_le: true

  resume_state: ~

train:
  total_iter: 25000
  warmup_iter: -1
  use_grad_clip: True

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [8000, 17000]
    restart_weights: [1,1]
    eta_mins: [0.0002,0.000001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_total:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 5e3
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
